<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Para Abigail 💛</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;600;700&family=Great+Vibes&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>

    <style>
        :root {
            --gold-primary: #ffd700;
            --gold-glow: #ffaa00;
            --pink-accent: #ff6b9d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body {
            background: radial-gradient(ellipse at center, #1a1a2e 0%, #0d0d18 60%, #05050a 100%);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            font-family: 'Dancing Script', cursive;
            cursor: pointer;
            color: #ffffff;
        }

        .font-great-vibes {
            font-family: 'Great Vibes', cursive;
        }

        .font-sans-clean {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        /* Glowing text shadow helpers */
        .text-glow-gold {
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.7), 0 0 20px rgba(255, 170, 0, 0.5), 0 0 30px rgba(255, 170, 0, 0.3);
        }

        .text-glow-intense {
            animation: pulseTextGlow 2.5s ease-in-out infinite alternate;
        }

        @keyframes pulseTextGlow {
            0% {
                text-shadow: 0 0 15px rgba(255, 215, 0, 0.6), 0 0 25px rgba(255, 170, 0, 0.4);
            }
            100% {
                text-shadow: 0 0 25px rgba(255, 215, 0, 0.9), 0 0 45px rgba(255, 170, 0, 0.8), 0 0 65px rgba(255, 100, 0, 0.5);
            }
        }

        /* Particles canvas layering */
        #starCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* Pulsing core glow behind heart */
        .center-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 280px;
            height: 280px;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.25) 0%, rgba(255, 170, 0, 0.08) 50%, transparent 70%);
            border-radius: 50%;
            animation: centerPulse 3s ease-in-out infinite alternate;
            pointer-events: none;
            z-index: 2;
        }

        @keyframes centerPulse {
            0% { transform: translate(-50%, -50%) scale(0.85); opacity: 0.5; }
            100% { transform: translate(-50%, -50%) scale(1.35); opacity: 0.95; }
        }

        /* Heart particle positioning */
        .heart-container {
            position: absolute;
            top: 48%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 320px;
            height: 320px;
            z-index: 3;
            pointer-events: none;
        }

        .heart-particle {
            position: absolute;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            box-shadow: 0 0 8px var(--gold-primary), 0 0 15px var(--gold-glow);
            animation: heartTwinkle 2s infinite alternate ease-in-out;
        }

        @keyframes heartTwinkle {
            0% { opacity: 0.5; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.3); }
        }

        /* Floating texts animation */
        .love-text {
            position: absolute;
            color: #ffffff;
            font-size: 1.35rem;
            text-shadow: 0 0 12px rgba(255, 215, 0, 0.7);
            z-index: 4;
            animation: floatSlow 5s infinite alternate ease-in-out;
            white-space: nowrap;
            pointer-events: none;
            opacity: 0.9;
        }

        @keyframes floatSlow {
            0% { transform: translateY(0px) rotate(-2deg); }
            50% { transform: translateY(-12px) rotate(2deg); }
            100% { transform: translateY(-20px) rotate(-1deg); }
        }

        /* Floating flower bouquet decor */
        .sunflower-bouquet {
            position: absolute;
            z-index: 4;
            font-size: 2.8rem;
            filter: drop-shadow(0 0 15px rgba(255, 200, 0, 0.6));
            animation: gentleSway 6s infinite alternate ease-in-out;
            pointer-events: none;
        }

        @keyframes gentleSway {
            0% { transform: rotate(-8deg) scale(0.95); }
            100% { transform: rotate(8deg) scale(1.05); }
        }

        /* Interactive Click Dynamic Elements */
        .touch-heart {
            position: fixed;
            pointer-events: none;
            font-size: 2.2rem;
            z-index: 100;
            animation: touchHeartAnim 1.6s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
        }

        @keyframes touchHeartAnim {
            0% { transform: translate(-50%, -50%) scale(0.2) rotate(0deg); opacity: 1; }
            50% { transform: translate(-50%, -120%) scale(1.6) rotate(180deg); opacity: 0.9; }
            100% { transform: translate(-50%, -240%) scale(0.4) rotate(360deg); opacity: 0; }
        }

        .touch-particle {
            position: fixed;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 99;
            animation: particleExplode 1.1s cubic-bezier(0.1, 0.9, 0.2, 1) forwards;
        }

        @keyframes particleExplode {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
        }

        .touch-wave {
            position: fixed;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 215, 0, 0.8);
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
            border-radius: 50%;
            pointer-events: none;
            z-index: 98;
            animation: waveExpand 1.2s ease-out forwards;
        }

        @keyframes waveExpand {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(22); opacity: 0; }
        }

        .touch-text {
            position: fixed;
            color: #ffd700;
            font-family: 'Great Vibes', cursive;
            font-size: 1.8rem;
            pointer-events: none;
            z-index: 101;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.9), 0 0 25px rgba(255, 170, 0, 0.7);
            animation: touchTextFloat 2.2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        @keyframes touchTextFloat {
            0% { transform: translate(-50%, -50%) scale(0.4); opacity: 0; }
            20% { opacity: 1; transform: translate(-50%, -80%) scale(1.2); }
            80% { opacity: 0.9; }
            100% { transform: translate(-50%, -220%) scale(0.8); opacity: 0; }
        }

        .touch-sunflower {
            position: fixed;
            font-size: 3.5rem;
            pointer-events: none;
            z-index: 100;
            animation: sunflowerPop 1.8s ease-out forwards;
            filter: drop-shadow(0 0 12px rgba(255, 215, 0, 0.8));
        }

        @keyframes sunflowerPop {
            0% { transform: translate(-50%, -50%) scale(0) rotate(-180deg); opacity: 0; }
            30% { transform: translate(-50%, -80%) scale(1.4) rotate(0deg); opacity: 1; }
            100% { transform: translate(-50%, -180%) scale(0.6) rotate(180deg); opacity: 0; }
        }

        /* Glassmorphism card for audio prompt */
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 215, 0, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
    </style>
</head>
<body class="relative flex flex-col justify-between items-center h-screen w-screen overflow-hidden select-none">

    <canvas id="starCanvas"></canvas>

    <!-- Glowing backlight -->
    <div class="center-glow"></div>

    <!-- Top Header -->
    <header class="relative z-10 pt-6 text-center w-full px-4">
        <h1 class="title font-great-vibes text-4xl sm:text-6xl text-white text-glow-intense tracking-wider transition-all duration-300">
            Para Abigail 💛
        </h1>
        <p class="font-sans-clean text-xs text-yellow-200/60 uppercase tracking-widest mt-1">Una dedicatoria de amor eterno</p>
    </header>

    <!-- Main Center Area -->
    <div class="relative w-full flex-1 flex justify-center items-center">
        
        <!-- Heart particle generator shell -->
        <div class="heart-container" id="heart"></div>

        <!-- Central Heart Messages -->
        <div class="absolute z-10 flex flex-col items-center justify-center text-center pointer-events-none transform -translate-y-4">
            <span class="te-amo-heart font-great-vibes text-3xl sm:text-4xl text-white text-glow-gold transition-all duration-300">
                Te amo 💛
            </span>
            <span class="mi-amor font-great-vibes text-4xl sm:text-5xl text-yellow-300 text-glow-intense mt-1 transition-all duration-300">
                Mi Amor 💛
            </span>
        </div>

        <!-- Scattered Floating Love Messages -->
        <div class="love-text hidden sm:block" style="top: 15%; left: 8%; animation-delay: 0s;">Te Amo 🌻</div>
        <div class="love-text" style="top: 22%; right: 10%; animation-delay: 0.8s;">Eres mi sol ☀️</div>
        <div class="love-text" style="top: 38%; left: 5%; animation-delay: 1.5s;">Eres preciosa ✨</div>
        <div class="love-text hidden md:block" style="top: 45%; right: 6%; animation-delay: 2.2s;">Me encantas 💕</div>
        <div class="love-text" style="top: 62%; left: 8%; animation-delay: 0.5s;">Siempre tuyo 💛</div>
        <div class="love-text" style="top: 68%; right: 12%; animation-delay: 1.2s;">Amor de mi vida 👑</div>
        <div class="love-text hidden sm:block" style="top: 80%; left: 15%; animation-delay: 2.7s;">Eres mi todo 💫</div>
        <div class="love-text" style="top: 28%; left: 38%; animation-delay: 1.9s;">Te adoro 💛</div>
        <div class="love-text hidden md:block" style="top: 75%; right: 35%; animation-delay: 0.3s;">Mi reina 👑</div>

        <!-- Scattered Sunflowers & Bouquets -->
        <div class="sunflower-bouquet" style="top: 12%; left: 18%; animation-delay: 0s;">🌻🌻</div>
        <div class="sunflower-bouquet" style="top: 18%; right: 22%; animation-delay: 1s;">🌻💐</div>
        <div class="sunflower-bouquet hidden sm:block" style="top: 58%; right: 18%; animation-delay: 2s;">🌻</div>
        <div class="sunflower-bouquet" style="top: 65%; left: 22%; animation-delay: 0.5s;">💐🌻</div>
        <div class="sunflower-bouquet hidden md:block" style="top: 35%; left: 28%; animation-delay: 1.5s;">💐</div>
        <div class="sunflower-bouquet hidden md:block" style="top: 48%; right: 25%; animation-delay: 2.5s;">🌻</div>
    </div>

    <!-- Floating Audio Control & Controls -->
    <div class="fixed top-4 right-4 z-50 flex items-center gap-2">
        <button id="musicBtn" class="glass-panel px-3 py-2 rounded-full text-xs text-yellow-300 font-sans-clean flex items-center gap-2 hover:bg-yellow-500/20 transition-all border border-yellow-400/30">
            <i class="fa-solid fa-music" id="musicIcon"></i>
            <span id="musicText">Música</span>
        </button>
    </div>

    <!-- Bottom Instruction Bar -->
    <footer class="relative z-10 pb-8 text-center px-4">
        <div class="instruction glass-panel px-6 py-2.5 rounded-full inline-flex items-center gap-2 text-yellow-200/90 text-lg sm:text-xl font-semibold shadow-lg border border-yellow-400/20">
            <span class="inline-block animate-bounce">✨</span> 
            <span>Toca la pantalla</span> 
            <span class="inline-block animate-bounce">✨</span>
        </div>
    </footer>

    <script>
        const canvas = document.getElementById('starCanvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initStars();
        });

        // Star particles background logic
        let stars = [];
        const numStars = 180;

        function initStars() {
            stars = [];
            for (let i = 0; i < numStars; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 2.2 + 0.5,
                    alpha: Math.random() * 0.8 + 0.2,
                    speed: Math.random() * 0.02 + 0.005,
                    phase: Math.random() * Math.PI * 2,
                    color: ['#ffd700', '#ffffff', '#ffea85', '#ffaa00'][Math.floor(Math.random() * 4)]
                });
            }
        }

        function drawStars() {
            ctx.clearRect(0, 0, width, height);
            stars.forEach(star => {
                star.phase += star.speed;
                const currentAlpha = star.alpha + Math.sin(star.phase) * 0.3;
                const clampedAlpha = Math.max(0.1, Math.min(1, currentAlpha));

                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fillStyle = star.color;
                ctx.globalAlpha = clampedAlpha;
                ctx.shadowBlur = star.size * 3;
                ctx.shadowColor = star.color;
                ctx.fill();
            });
            ctx.globalAlpha = 1;
            requestAnimationFrame(drawStars);
        }

        initStars();
        drawStars();

        const heartContainer = document.getElementById('heart');
        const isMobile = window.innerWidth < 640;
        const totalHeartParticles = isMobile ? 200 : 320;
        const heartScale = isMobile ? 7 : 10;

        function createHeart() {
            heartContainer.innerHTML = '';
            for (let i = 0; i < totalHeartParticles; i++) {
                const t = (i / totalHeartParticles) * Math.PI * 2;
                
                // Parametric heart equation
                const x = 16 * Math.pow(Math.sin(t), 3);
                const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));

                const particle = document.createElement('div');
                particle.className = 'heart-particle';

                // Responsive positioning offset
                const px = x * heartScale + (heartContainer.clientWidth / 2);
                const py = y * heartScale + (heartContainer.clientHeight / 2);

                particle.style.left = px + 'px';
                particle.style.top = py + 'px';
                particle.style.animationDelay = (Math.random() * 2).toFixed(2) + 's';
                particle.style.animationDuration = (1.5 + Math.random() * 1.5).toFixed(2) + 's';

                const colors = ['#ffd700', '#ffaa00', '#ffcc00', '#ffe44d', '#ffffff'];
                particle.style.background = colors[Math.floor(Math.random() * colors.length)];

                heartContainer.appendChild(particle);
            }
        }

        createHeart();

        function createFloatingParticle() {
            const particle = document.createElement('div');
            const size = Math.random() * 4 + 2;
            particle.style.position = 'fixed';
            particle.style.width = size + 'px';
            particle.style.height = size + 'px';
            particle.style.background = '#ffd700';
            particle.style.borderRadius = '50%';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.bottom = '-10px';
            particle.style.zIndex = '2';
            particle.style.opacity = (Math.random() * 0.7 + 0.3).toString();
            particle.style.boxShadow = '0 0 10px #ffd700, 0 0 20px #ffaa00';
            particle.style.pointerEvents = 'none';
            particle.style.transition = 'all ' + (4 + Math.random() * 3) + 's linear';

            document.body.appendChild(particle);

            setTimeout(() => {
                particle.style.bottom = '105%';
                particle.style.opacity = '0';
                particle.style.transform = `translateX(${(Math.random() - 0.5) * 100}px)`;
            }, 50);

            setTimeout(() => {
                particle.remove();
            }, 7000);
        }

        setInterval(createFloatingParticle, 180);

        let synth = null;
        let isMusicPlaying = false;
        let loopSequence = null;

        function initMusic() {
            if (synth) return;
            synth = new Tone.PolySynth(Tone.Synth, {
                oscillator: { type: "sine" },
                envelope: {
                    attack: 0.1,
                    decay: 0.3,
                    sustain: 0.4,
                    release: 1.2
                }
            }).toDestination();
            synth.volume.value = -12;

            // Soft romantic melodic chord progression
            const melody = [
                { time: '0:0', note: ['C4', 'E4', 'G4', 'B4'], duration: '2n' },
                { time: '0:2', note: ['G3', 'B3', 'D4', 'F#4'], duration: '2n' },
                { time: '1:0', note: ['A3', 'C4', 'E4', 'G4'], duration: '2n' },
                { time: '1:2', note: ['F3', 'A3', 'C4', 'E4'], duration: '2n' },
            ];

            loopSequence = new Tone.Part((time, value) => {
                synth.triggerAttackRelease(value.note, value.duration, time);
            }, melody);

            loopSequence.loop = true;
            loopSequence.loopEnd = '2m';
        }

        const musicBtn = document.getElementById('musicBtn');
        const musicIcon = document.getElementById('musicIcon');
        const musicText = document.getElementById('musicText');

        async function toggleMusic() {
            try {
                await Tone.start();
                initMusic();

                if (!isMusicPlaying) {
                    Tone.Transport.start();
                    loopSequence.start(0);
                    isMusicPlaying = true;
                    musicIcon.className = 'fa-solid fa-volume-high animate-pulse';
                    musicText.textContent = 'Sonando';
                    musicBtn.classList.add('bg-yellow-500/30', 'border-yellow-400');
                } else {
                    Tone.Transport.stop();
                    isMusicPlaying = false;
                    musicIcon.className = 'fa-solid fa-music';
                    musicText.textContent = 'Música';
                    musicBtn.classList.remove('bg-yellow-500/30', 'border-yellow-400');
                }
            } catch (err) {
                console.error("Audio block:", err);
            }
        }

        musicBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleMusic();
        });

        const touchTexts = [
            'Te amo 💛', 
            'Abigail ✨', 
            'Mi amor 🌻', 
            'Eres todo 💕', 
            'Siempre juntos 💛', 
            'Mi reina 👑', 
            'Te adoro 💛', 
            'Hermosa ✨', 
            'Eres mi sol ☀️', 
            'Amor infinito 💫'
        ];
        
        const heartEmojis = ['💛', '💕', '💖', '💗', '💝', '🌻', '✨', '💫', '👑', '💐'];

        function handleInteractiveTrigger(x, y) {
            // Optional subtle audio feedback chime on tap
            if (isMusicPlaying && synth) {
                const chimes = ['C5', 'E5', 'G5', 'B5', 'D6'];
                const randomNote = chimes[Math.floor(Math.random() * chimes.length)];
                synth.triggerAttackRelease(randomNote, '8n');
            }

            // 1. Floating Emoji/Heart Symbol
            const heart = document.createElement('div');
            heart.className = 'touch-heart';
            heart.textContent = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
            heart.style.left = x + 'px';
            heart.style.top = y + 'px';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 1600);

            // 2. Explosive Particle Burst
            const particleCount = isMobile ? 12 : 18;
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'touch-particle';
                
                const angle = (i / particleCount) * Math.PI * 2;
                const distance = 60 + Math.random() * 70;
                const tx = Math.cos(angle) * distance + 'px';
                const ty = Math.sin(angle) * distance + 'px';
                
                particle.style.setProperty('--tx', tx);
                particle.style.setProperty('--ty', ty);
                particle.style.left = x + 'px';
                particle.style.top = y + 'px';
                
                const colors = ['#ffd700', '#ffaa00', '#ffcc00', '#ffe44d', '#ffffff', '#ff6b9d'];
                const color = colors[Math.floor(Math.random() * colors.length)];
                particle.style.background = color;
                particle.style.boxShadow = `0 0 10px ${color}, 0 0 20px ${color}`;
                
                document.body.appendChild(particle);
                setTimeout(() => particle.remove(), 1100);
            }

            // 3. Shockwave Ripple
            const wave = document.createElement('div');
            wave.className = 'touch-wave';
            wave.style.left = x + 'px';
            wave.style.top = y + 'px';
            document.body.appendChild(wave);
            setTimeout(() => wave.remove(), 1200);

            // 4. Floating Love Affirmation Text
            const text = document.createElement('div');
            text.className = 'touch-text';
            text.textContent = touchTexts[Math.floor(Math.random() * touchTexts.length)];
            text.style.left = x + 'px';
            text.style.top = y + 'px';
            document.body.appendChild(text);
            setTimeout(() => text.remove(), 2200);

            // 5. Chance of Blooming Sunflower
            if (Math.random() > 0.5) {
                const sunflower = document.createElement('div');
                sunflower.className = 'touch-sunflower';
                sunflower.textContent = Math.random() > 0.5 ? '🌻' : '💐';
                sunflower.style.left = x + 'px';
                sunflower.style.top = y + 'px';
                document.body.appendChild(sunflower);
                setTimeout(() => sunflower.remove(), 1800);
            }
        }

        // Mouse click listener
        document.body.addEventListener('click', (e) => {
            // Avoid triggering when clicking buttons
            if (e.target.closest('button')) return;
            handleInteractiveTrigger(e.clientX, e.clientY);
        });

        // Touch listener for smooth mobile experience
        document.body.addEventListener('touchstart', (e) => {
            if (e.target.closest('button')) return;
            for (let i = 0; i < e.touches.length; i++) {
                handleInteractiveTrigger(e.touches[i].clientX, e.touches[i].clientY);
            }
        }, { passive: true });
    </script>
</body>
</html>
